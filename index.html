
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISANKA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" >
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="contenedor-login">
        <div class="decoracion decoracion-uno"></div>
        <div class="decoracion decoracion-dos"></div>
        <div class="decoracion decoracion-tres"></div>

        <section class="tarjeta-login">
                       <h1 style="align-items: center; text-align: center;">AISANKA</h1>
            <div class="contenedor-logo">
                
                <div class="circulo-logo">
                    
                    <img  src="images/logo_app.png"  alt="Logo de AISANKA" class="logo" >
                </div>
            </div>

            <header class="encabezado-login">

                <span class="etiqueta-bienvenida">
                    <i class="fa-solid fa-seedling"></i>
                    ¡Panel estudiante!
                </span>

     
            </header>

            <form id="formularioLogin" novalidate>

                <div class="grupo-campo">

                    <label for="correo">
                        <i class="fa-solid fa-envelope"></i>
                        Correo electrónico
                    </label>

                    <div class="contenedor-campo">

                        <i class="fa-solid fa-envelope icono-campo"></i>

                        <input
                            type="email"
                            id="correo"
                            placeholder="Escribe tu correo"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <div class="grupo-campo">

                    <label for="contrasena">
                        <i class="fa-solid fa-key"></i>
                        Contraseña
                    </label>

                    <div class="contenedor-campo">

                        <i class="fa-solid fa-lock icono-campo"></i>

                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Escribe tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="boton-mostrar"
                            id="botonMostrar"
                            aria-label="Mostrar contraseña"
                        >
                            <i
                                class="fa-solid fa-eye"
                                id="iconoOjo"
                            ></i>
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="boton-iniciar"
                >
                    <span>Entrar a AISANKA</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <footer class="pie-login">

                <div class="iconos-pie">
                    <span>
                        <i class="fa-solid fa-book-open"></i>
                    </span>

                    <span>
                        <i class="fa-solid fa-gamepad"></i>
                    </span>

                    <span>
                        <i class="fa-solid fa-globe"></i>
                    </span>
                </div>

                <strong>AISANKA</strong>

                <span>
                    El idioma que une a Nicaragua
                </span>

            </footer>

        </section>

    </main>


    <div
        class="fondo-modal"
        id="ventanaError"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloError"
    >

        <div class="modal-error">

            <button
                type="button"
                class="boton-cerrar"
                id="botonCerrar"
                aria-label="Cerrar mensaje"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="icono-error">
                <i class="fa-solid fa-face-frown"></i>
            </div>

            <span class="etiqueta-modal">
                ¡Ups!
            </span>

            <h2 id="tituloError">
                Datos incorrectos
            </h2>

            <p id="mensajeError">
                Revisa tu correo y contraseña e inténtalo nuevamente.
            </p>

            <button
                type="button"
                class="boton-entendido"
                id="botonEntendido"
            >
                Intentar nuevamente
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>

    </div>


    <script src="index.js"></script>

</body>

</html>
